[[mgr.prepend_keymap]]
desc = "Open help..."
on = ["?"]
run = "help"

[[mgr.prepend_keymap]]
desc = "Quit"
on = ["Q"]
run = "quit"

[[mgr.prepend_keymap]]
desc = "Close current tab or quit if last"
on = ["q"]
run = "close"

[[mgr.prepend_keymap]]
desc = "Create a directory"
on = ["o"]
run = "create --dir"

[[mgr.prepend_keymap]]
desc = "Create a file (append / for directory)"
on = ["O"]
run = "create"

[[mgr.prepend_keymap]]
desc = "Rename, cursor at start"
on = ["i"]
run = "rename --cursor=start"

[[mgr.prepend_keymap]]
desc = "Rename, cursor before extension"
on = ["a"]
run = "rename --cursor=before_ext"

[[mgr.prepend_keymap]]
desc = "Rename, cursor at end"
on = ["A"]
run = "rename --cursor=end"

[[mgr.prepend_keymap]]
desc = "Rename, leave extension"
on = ["r"]
run = "rename --empty=stem --cursor=start"

[[mgr.prepend_keymap]]
desc = "Rename"
on = ["R"]
run = "rename --empty=all"

[[mgr.prepend_keymap]]
desc = "Exit visual mode, clear selected, or cancel search"
on = ["<Esc>"]
run = ["escape", "unyank"]

[[mgr.prepend_keymap]]
desc = "Open shell here"
on = ["<C-d>"]
run = 'shell "$SHELL" --block --confirm'

[[mgr.prepend_keymap]]
desc = "Move cursor half page down"
on = ["<C-j>"]
run = "arrow  50%"

[[mgr.prepend_keymap]]
desc = "Move cursor half page up"
on = ["<C-k>"]
run = "arrow -50%"

[[mgr.prepend_keymap]]
desc = "Switch to previous tab"
on = ["J"]
run = "tab_switch -1 --relative"

[[mgr.prepend_keymap]]
desc = "Switch to next tab"
on = ["K"]
run = "tab_switch  1 --relative"

[[mgr.prepend_keymap]]
desc = "Disk Usage (dua i)"
on = ["u"]
run = "shell 'dua i' --block --confirm"

[[mgr.prepend_keymap]]
desc = "Copy file using URI (file://)"
on = ["c", "c"]
run = """shell 'filename="$1" && wl-copy "file://$filename" --type text/uri-list' --confirm"""

[[mgr.prepend_keymap]]
desc = "Copy Absolute path"
on = ["c", "a"]
run = "copy path"

[[mgr.prepend_keymap]]
desc = "Copy path of parent Directory"
on = ["c", "d"]
run = "copy dirname"

[[mgr.prepend_keymap]]
desc = "Copy name of file without Extension"
on = ["c", "e"]
run = "copy name_without_ext"

[[mgr.prepend_keymap]]
desc = "Copy Name of file"
on = ["c", "n"]
run = "copy filename"

[[mgr.prepend_keymap]]
desc = "Sort by Birth time (reverse)"
on = [",", "b"]
run = ["sort btime --dir-first --reverse", "linemode btime"]

[[mgr.prepend_keymap]]
desc = "Sort by Birth time"
on = [",", "B"]
run = ["sort btime --dir-first --reverse=no", "linemode btime"]

[[mgr.prepend_keymap]]
desc = "Sort by Modified time (reverse)"
on = [",", "m"]
run = ["sort mtime --dir-first --reverse", "linemode mtime"]

[[mgr.prepend_keymap]]
desc = "Sort by Modified time"
on = [",", "M"]
run = ["sort mtime --dir-first --reverse=no", "linemode mtime"]

[[mgr.prepend_keymap]]
desc = "Sort by Size (reverse)"
on = [",", "s"]
run = ["sort size --dir-first --reverse", "linemode size"]

[[mgr.prepend_keymap]]
desc = "Sort by Size"
on = [",", "S"]
run = ["sort size --dir-first --reverse=no", "linemode size"]

[[mgr.prepend_keymap]]
desc = "eXtract from Zip"
on = ["z", "x", "z"]
run = """shell --confirm 'unzip "$1"' """

[[mgr.prepend_keymap]]
desc = "eXtract from Zip"
on = ["z", "z", "x"]
run = """shell --confirm 'unzip "$1"' """

